version: '3.8'

# Equine Oracle Docker Compose Configuration
# For local development and testing

services:
  # Backend API Service
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: equine-oracle-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/equine_oracle
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=development-secret-key
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - equine-oracle
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ML Service
  ml:
    build:
      context: ml
      dockerfile: Dockerfile
    container_name: equine-oracle-ml
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PYTHON_ENV=development
      - MODEL_PATH=/app/ml/models
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/equine_oracle
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/data:/app/ml/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - equine-oracle
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: equine-oracle-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=equine_oracle
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ml/data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - equine-oracle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: equine-oracle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - equine-oracle
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: equine-oracle-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - equine-oracle
    depends_on:
      - backend
      - ml

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: equine-oracle-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - equine-oracle
    depends_on:
      - prometheus

  # Node Exporter for System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: equine-oracle-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - equine-oracle

  # Admin Dashboard (optional)
  admin:
    build:
      context: ../equine_oracle_admin
      dockerfile: Dockerfile
    container_name: equine-oracle-admin
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://postgres:postgres@postgres:5432/equine_oracle
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=development-secret-key
      - PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - equine-oracle

  # Frontend (optional)
  frontend:
    build:
      context: ../equine-oracle-frontend
      dockerfile: Dockerfile
    container_name: equine-oracle-frontend
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - equine-oracle

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  equine-oracle:
    driver: bridge
