name: ML Pipeline - Training & Evaluation

on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - 'backend/src/**'
  schedule:
    # Daily retraining at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      retrain_all:
        description: 'Retrain all models from scratch'
        required: false
        default: 'false'
      evaluate_only:
        description: 'Only evaluate existing models'
        required: false
        default: 'false'

concurrency:
  group: ml-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.8.3'

jobs:
  prepare:
    name: Prepare Training Environment
    runs-on: ubuntu-latest
    outputs:
      data_ready: ${{ steps.prepare.outputs.data_ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install boto3 pandas numpy scikit-learn

      - name: Setup MySQL for training data
        uses: mysql/mysql-container-action@v1
        with:
          mysql version: '8.0'
          mysql database: 'equine_oracle_training'
          mysql user: 'ml_user'
          mysql password: 'ml_password'
          mysql root password: 'root_password'
          mysql port: 3306

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            if mysql -h 127.0.0.1 -P 3306 -uroot -proot_password -e "SELECT 1" 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/15)"
            sleep 5
          done

      - name: Load training data
        id: prepare
        run: |
          # Create database schema
          mysql -h 127.0.0.1 -P 3306 -uroot -proot_password equine_oracle_training < ml/data/schema.sql 2>/dev/null || true
          
          # Download training data from S3 if available
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            pip install boto3 -q
            python -c "
            import boto3
            import os
            
            s3 = boto3.client(
                's3',
                aws_access_key_id='${{ secrets.AWS_ACCESS_KEY_ID }}',
                aws_secret_access_key='${{ secrets.AWS_SECRET_ACCESS_KEY }}'
            )
            
            # List and download training data
            try:
                objects = s3.list_objects_v2(Bucket='equine-oracle-data', Prefix='training/')
                for obj in objects.get('Contents', []):
                    if obj['Key'].endswith('.csv'):
                        local_path = os.path.basename(obj['Key'])
                        s3.download_file('equine-oracle-data', obj['Key'], f'ml/data/{local_path}')
                        print(f'Downloaded: {obj[\"Key\"]}')
            except Exception as e:
                print(f'Error downloading from S3: {e}')
          fi
          
          # Check if data exists
          if [ -f "ml/data/training_data.csv" ]; then
            echo "Training data found"
            echo "data_ready=true" >> $GITHUB_OUTPUT
          else
            echo "Training data not found, will use synthetic data"
            echo "data_ready=false" >> $GITHUB_OUTPUT
          fi

  train:
    name: Train Models
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Train base models
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'ml')
          
          from ensemble.weighted_ensemble import WeightedEnsemble, EnsembleOptimizer
          from models.model_registry import ModelRegistry
          import numpy as np
          import pandas as pd
          import joblib
          import json
          import os
          
          # Create synthetic training data if needed
          if not os.path.exists('ml/data/training_data.csv'):
              print('Creating synthetic training data...')
              n_samples = 10000
              n_features = 120
              
              # Generate features
              data = {
                  f'feature_{i}': np.random.randn(n_samples) for i in range(n_features)
              }
              data['result'] = np.random.randint(0, 2, n_samples)
              data['race_id'] = np.random.randint(0, 100, n_samples)
              
              df = pd.DataFrame(data)
              df.to_csv('ml/data/training_data.csv', index=False)
              print(f'Created synthetic data with {n_samples} samples')
          
          # Load data
          df = pd.read_csv('ml/data/training_data.csv')
          print(f'Loaded {len(df)} training samples')
          
          # Initialize model registry
          registry = ModelRegistry('ml/models')
          
          # Train individual models
          from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier
          from sklearn.linear_model import LogisticRegression
          import lightgbm as lgb
          import xgboost as xgb
          
          X = df.drop(columns=['result', 'race_id']).values
          y = df['result'].values
          groups = df.groupby('race_id').size().values if 'race_id' in df.columns else None
          
          models = {}
          
          # LightGBM Ranker
          print('Training LightGBM Ranker...')
          lgbm = lgb.LGBMRanker(objective='lambdarank', metric='ndcg', num_leaves=31, learning_rate=0.05, n_estimators=100)
          lgbm.fit(X, y, group=groups)
          models['lightgbm_ranker'] = lgbm
          registry.register_model('lightgbm_ranker', lgbm, {'type': 'ranker', 'framework': 'lightgbm'})
          
          # XGBoost Ranker
          print('Training XGBoost Ranker...')
          xgb_model = xgb.XGBRanker(objective='rank:pairwise', n_estimators=100, eta=0.03, max_depth=7)
          xgb_model.fit(X, y, group=groups)
          models['xgboost_ranker'] = xgb_model
          registry.register_model('xgboost_ranker', xgb_model, {'type': 'ranker', 'framework': 'xgboost'})
          
          # Random Forest
          print('Training Random Forest...')
          rf = RandomForestClassifier(n_estimators=100, max_depth=10, random_state=42, n_jobs=-1)
          rf.fit(X, y)
          models['random_forest'] = rf
          registry.register_model('random_forest', rf, {'type': 'classifier', 'framework': 'sklearn'})
          
          # Logistic Regression
          print('Training Logistic Regression...')
          lr = LogisticRegression(max_iter=1000, random_state=42)
          lr.fit(X, y)
          models['logistic_regression'] = lr
          registry.register_model('logistic_regression', lr, {'type': 'classifier', 'framework': 'sklearn'})
          
          # Create weighted ensemble
          print('Creating weighted ensemble...')
          ensemble = WeightedEnsemble(models)
          
          # Set initial equal weights
          weights = {name: 1.0/len(models) for name in models.keys()}
          ensemble.set_weights(weights)
          
          # Save models
          joblib.dump(ensemble, 'ml/models/weighted_ensemble.pkl')
          registry.save_metadata('ml/models/model_metadata.json')
          
          print('✓ All models trained successfully')
          " 2>&1 | tee training_log.txt

      - name: Optimize ensemble weights
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'ml')
          
          from ensemble.weighted_ensemble import WeightedEnsemble, EnsembleOptimizer
          import numpy as np
          import pandas as pd
          import joblib
          import json
          
          # Load or create validation data
          if not os.path.exists('ml/data/validation_data.csv'):
              print('Creating synthetic validation data...')
              n_samples = 2000
              n_features = 120
              data = {f'feature_{i}': np.random.randn(n_samples) for i in range(n_features)}
              data['result'] = np.random.randint(0, 2, n_samples)
              data['race_id'] = np.random.randint(0, 20, n_samples)
              df = pd.DataFrame(data)
              df.to_csv('ml/data/validation_data.csv', index=False)
          
          df = pd.read_csv('ml/data/validation_data.csv')
          X_val = df.drop(columns=['result', 'race_id']).values
          y_val = df['result'].values
          groups_val = df.groupby('race_id').size().values if 'race_id' in df.columns else None
          
          # Load ensemble
          ensemble = joblib.load('ml/models/weighted_ensemble.pkl')
          
          # Optimize weights
          print('Optimizing ensemble weights...')
          optimizer = EnsembleOptimizer(ensemble)
          optimized_weights = optimizer.optimize_weights(
              X_val, y_val, X_val, y_val,
              metric='ndcg_at_1',
              n_iterations=50
          )
          
          print(f'Optimized weights: {optimized_weights}')
          
          # Save optimized ensemble
          joblib.dump(ensemble, 'ml/models/weighted_ensemble_optimized.pkl')
          
          # Save weights
          with open('ml/models/optimized_weights.json', 'w') as f:
              json.dump(optimized_weights, f, indent=2)
          
          print('✓ Ensemble weights optimized')
          " 2>&1 | tee optimization_log.txt

      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            ml/models/
            training_log.txt
            optimization_log.txt
          retention-days: 30

  evaluate:
    name: Model Evaluation
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: ml/

      - name: Install dependencies
        run: pip install -r ml/requirements.txt pandas numpy scikit-learn

      - name: Run evaluation
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'ml')
          
          import joblib
          import pandas as pd
          import numpy as np
          from sklearn.metrics import ndcg_score, mean_squared_error, accuracy_score, precision_score, recall_score, f1_score
          import json
          
          # Load or create test data
          if not os.path.exists('ml/data/test_data.csv'):
              print('Creating synthetic test data...')
              n_samples = 5000
              n_features = 120
              data = {f'feature_{i}': np.random.randn(n_samples) for i in range(n_features)}
              data['result'] = np.random.randint(0, 2, n_samples)
              data['race_id'] = np.random.randint(0, 50, n_samples)
              df = pd.DataFrame(data)
              df.to_csv('ml/data/test_data.csv', index=False)
          
          df = pd.read_csv('ml/data/test_data.csv')
          X_test = df.drop(columns=['result', 'race_id']).values
          y_test = df['result'].values
          
          # Load ensemble
          ensemble = joblib.load('ml/models/weighted_ensemble_optimized.pkl')
          
          # Generate predictions
          y_pred = ensemble.predict(X_test)
          
          # Calculate metrics
          ndcg_1 = ndcg_score([np.arange(len(y_test))], [y_pred], k=1)
          ndcg_3 = ndcg_score([np.arange(len(y_test))], [y_pred], k=3)
          ndcg_4 = ndcg_score([np.arange(len(y_test))], [y_pred], k=4)
          
          # For classification metrics, threshold at 0.5
          y_pred_class = (y_pred > 0.5).astype(int)
          accuracy = accuracy_score(y_test, y_pred_class)
          precision = precision_score(y_test, y_pred_class)
          recall = recall_score(y_test, y_pred_class)
          f1 = f1_score(y_test, y_pred_class)
          mse = mean_squared_error(y_test, y_pred)
          
          print(f'Test NDCG@1: {ndcg_1:.4f}')
          print(f'Test NDCG@3: {ndcg_3:.4f}')
          print(f'Test NDCG@4: {ndcg_4:.4f}')
          print(f'Test Accuracy: {accuracy:.4f}')
          print(f'Test Precision: {precision:.4f}')
          print(f'Test Recall: {recall:.4f}')
          print(f'Test F1: {f1:.4f}')
          print(f'Test MSE: {mse:.4f}')
          
          # Save evaluation results
          results = {
              'ndcg_at_1': float(ndcg_1),
              'ndcg_at_3': float(ndcg_3),
              'ndcg_at_4': float(ndcg_4),
              'accuracy': float(accuracy),
              'precision': float(precision),
              'recall': float(recall),
              'f1_score': float(f1),
              'mse': float(mse),
              'timestamp': pd.Timestamp.now().isoformat(),
              'commit': '${{ github.sha }}'
          }
          
          with open('evaluation_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          # Check thresholds
          if ndcg_1 < 0.95:
              print('::warning::NDCG@1 below 0.95 threshold')
          if ndcg_4 < 0.90:
              print('::warning::NDCG@4 below 0.90 threshold')
          if accuracy < 0.85:
              print('::error::Accuracy below 0.85 threshold')
              exit(1)
          
          print('✓ All evaluation thresholds passed')
          " 2>&1 | tee evaluation_log.txt

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            evaluation_results.json
            evaluation_log.txt

      - name: Update model registry
        if: github.ref == 'refs/heads/main'
        run: |
          python -c "
          import json
          import requests
          import os
          
          with open('evaluation_results.json') as f:
              results = json.load(f)
          
          # Save to S3
          if os.environ.get('AWS_ACCESS_KEY_ID'):
              import boto3
              s3 = boto3.client(
                  's3',
                  aws_access_key_id='${{ secrets.AWS_ACCESS_KEY_ID }}',
                  aws_secret_access_key='${{ secrets.AWS_SECRET_ACCESS_KEY }}'
              )
              
              # Upload evaluation results
              s3.upload_file(
                  'evaluation_results.json',
                  'equine-oracle-models',
                  f'evaluations/${{ github.sha }}.json'
              )
              
              # Upload latest evaluation
              s3.upload_file(
                  'evaluation_results.json',
                  'equine-oracle-models',
                  'evaluations/latest.json'
              )
              
              print('✓ Evaluation results uploaded to S3')
          " 2>&1 || echo "S3 upload skipped"

  deploy-models:
    name: Deploy Models
    needs: evaluate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: ml/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AWS CLI
        run: pip install awscli boto3

      - name: Configure AWS
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/config
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials

      - name: Upload models to S3
        run: |
          # Sync models to S3
          aws s3 sync ml/models/ s3://equine-oracle-models/${{ github.sha }}/ --exclude "*" --include "*.pkl" --include "*.json"
          
          # Update latest tag
          aws s3 sync ml/models/ s3://equine-oracle-models/latest/ --exclude "*" --include "*.pkl" --include "*.json"
          
          # Upload evaluation results
          aws s3 cp evaluation_results.json s3://equine-oracle-models/evaluations/${{ github.sha }}.json
          aws s3 cp evaluation_results.json s3://equine-oracle-models/evaluations/latest.json
          
          echo "✓ Models deployed to S3"

      - name: Invalidate CloudFront cache
        if: success()
        run: |
          # Invalidate CloudFront cache for model downloads
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/models/*" 2>/dev/null || echo "CloudFront invalidation skipped"

  notify:
    name: Notify Training Results
    needs: [train, evaluate, deploy-models]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download evaluation results
        uses: actions/download-artifact@v4
        with:
          name: evaluation-results
          path: ./

      - name: Extract NDCG score
        id: extract
        run: |
          if [ -f "evaluation_results.json" ]; then
            NDCG=$(jq -r '.ndcg_at_1' evaluation_results.json 2>/dev/null || echo "N/A")
            echo "ndcg=$NDCG" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord notification
        uses: Ilshidur/action-discord@0.6.8
        with:
          args: "🎯 ML Pipeline ${{ job.status }} on ${{ github.ref }}. NDCG@1: ${{ steps.extract.outputs.ndcg || 'N/A' }}. View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
